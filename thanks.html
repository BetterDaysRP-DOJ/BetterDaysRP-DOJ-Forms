<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Application Received | BetterDays RP DOJ</title>
<style>
  :root {
    --bg: #eef0f4; --card: #ffffff; --ink: #1b2233; --muted: #5b6477;
    --line: #cfd4de; --navy: #1f2f56; --gold: #b58a2b; --ok: #1f6b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #131722; --card: #1c2231; --ink: #e8ebf2; --muted: #98a1b6;
            --line: #343c52; --navy: #8fa6e0; --gold: #d4a94a; --ok: #7fd49b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Georgia, "Times New Roman", serif; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  header { border-bottom: 3px solid var(--gold); padding-bottom: 16px; margin-bottom: 24px; }
  h1 { margin: 0; font-size: 1.7rem; color: var(--navy); }
  header p { margin: 4px 0 0; color: var(--muted); }
  .card { background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--ok);
          border-radius: 8px; padding: 28px 24px; }
  .card h2 { margin: 0 0 8px; font-size: 1.3rem; color: var(--ok); }
  .card p { margin: 0; font-size: 1.05rem; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BetterDays RP - Department of Justice</h1>
    <p>Firearm Registration and Business Licensing Applications</p>
  </header>
  <div class="card" role="status">
    <h2>Application received</h2>
    <p>Your form has been received. You will receive a response in the active Discord ticket.</p>
  </div>
</div>
</body>
</html>
